<div class="cpr-container">

    <!-- ── 压缩素材 ─────────────────────────────────────────────── -->
    <div class="cpr-section">
        <div class="cpr-section-hd">
            <span class="cpr-section-label">
                <i class="fa-solid fa-layer-group"></i> 压缩素材
            </span>
        </div>

        <!-- 世界书浏览器 -->
        <div class="cpr-browser-hd">
            <select
                id="cpr-browse-bookname"
                class="cpr-select cpr-select--flex"
                title="选择世界书以浏览其条目"
                onchange="document.dispatchEvent(new CustomEvent('Cpr_refreshEntries'))"
            ><option value="">选择世界书...</option></select>
            <button
                class="cpr-icon-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_refreshEntries'))"
                title="刷新条目列表"
            ><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div id="cpr-entry-checklist" class="cpr-entry-checklist">
            <div class="cpr-entry-empty">选择世界书以浏览条目</div>
        </div>
        <div class="cpr-browser-footer">
            <button
                class="cpr-add-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_addChecked'))"
                title="将勾选的条目加入压缩顺序"
            ><i class="fa-solid fa-plus"></i> 添加选中条目</button>
            <label class="cpr-check-all-label">
                <input type="checkbox" id="cpr-check-all"
                    onchange="document.dispatchEvent(new CustomEvent('Cpr_toggleCheckAll'))" />
                全选
            </label>
        </div>

        <!-- 压缩顺序 -->
        <div class="cpr-order-hd">
            <span class="cpr-section-label" style="font-size:10px;opacity:0.75">
                <i class="fa-solid fa-sort"></i> 压缩顺序
            </span>
            <button
                class="cpr-icon-btn cpr-icon-btn--del"
                style="padding:3px 8px;font-size:10px"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_clearAll'))"
                title="清空所有条目"
            ><i class="fa-solid fa-trash"></i> 清空</button>
        </div>
        <div id="cpr-entry-list" class="cpr-entry-list">
            <!-- 条目行由 JS 动态注入 -->
        </div>
        <div class="cpr-tip-inline">
            <i class="fa-solid fa-circle-info"></i>
            拖动 <i class="fa-solid fa-grip-lines"></i> 调整顺序；条目将按此顺序注入为模拟历史档案。
        </div>
    </div>

    <div class="cpr-divider"></div>

    <!-- ── 压缩提示词 ────────────────────────────────────────────── -->
    <div class="cpr-section">
        <div class="cpr-section-hd">
            <span class="cpr-section-label">压缩提示词</span>
        </div>
        <textarea
            id="cpr-prompt"
            class="cpr-textarea"
            rows="5"
            placeholder="输入压缩提示词..."
        ></textarea>
        <div class="cpr-preset-row">
            <select id="cpr-presets" class="cpr-select" title="选择已保存的预设">
                <option value="">— 选择预设 —</option>
            </select>
            <button
                class="cpr-icon-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_applyPreset'))"
                title="加载选中预设到编辑区"
            ><i class="fa-solid fa-file-import"></i> 加载</button>
            <button
                class="cpr-icon-btn cpr-icon-btn--new"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_newPreset'))"
                title="新建空白预设（清空编辑区，输入新内容后再保存）"
            ><i class="fa-solid fa-plus"></i> 新建</button>
            <button
                class="cpr-icon-btn cpr-icon-btn--save"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_savePreset'))"
                title="将当前提示词另存为预设"
            ><i class="fa-solid fa-floppy-disk"></i> 保存</button>
            <button
                class="cpr-icon-btn cpr-icon-btn--del"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_deletePreset'))"
                title="删除选中预设"
            ><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="cpr-tip-inline" style="margin-top:3px">
            <i class="fa-solid fa-circle-info"></i>
            内置预设随版本统一更新，如有微调请另存为其他名称。
        </div>
    </div>

    <div class="cpr-divider"></div>

    <!-- ── 启动方式 ────────────────────────────────────────────── -->
    <div class="cpr-section">
        <div class="cpr-section-hd">
            <span class="cpr-section-label">启动方式</span>
        </div>

        <div class="cpr-launch-grid">
            <label class="cpr-launch-item">
                <input type="radio" name="cpr-launch-role" value="assistant" />
                <div class="cpr-launch-card">🤖 AI助手</div>
            </label>
            <label class="cpr-launch-item">
                <input type="radio" name="cpr-launch-role" value="system" />
                <div class="cpr-launch-card">⚙️ System</div>
            </label>
        </div>

        <div class="cpr-trigger-row">
            <label for="cpr-trigger-text" class="cpr-trigger-label">触发文本</label>
            <input
                type="text"
                id="cpr-trigger-text"
                class="cpr-trigger-input"
                value="角色扮演暂停，请对上方所有档案进行压缩归档"
                placeholder="角色扮演暂停，请对上方所有档案进行压缩归档"
            />
        </div>
    </div>

    <!-- ── 执行按钮 ─────────────────────────────────────────────── -->
    <div class="cpr-action-row">
        <button
            class="cpr-execute-btn"
            onclick="document.dispatchEvent(new CustomEvent('Cpr_execute'))"
            title="读取所有条目内容，模拟为历史档案，触发AI进行压缩"
        >
            <i class="fa-solid fa-compress-arrows-alt"></i> 开始压缩
        </button>
    </div>
    <div class="cpr-tip-box">
        <i class="fa-solid fa-circle-info"></i>
        AI将读取上方条目内容（模拟为聊天历史），对其进行二次压缩。实际聊天记录将在生成期间临时隐藏。
    </div>

    <div class="cpr-divider"></div>

    <!-- ── 保存目标 ──────────────────────────────────────────────── -->
    <div class="cpr-section">
        <div class="cpr-section-hd">
            <span class="cpr-section-label">
                <i class="fa-solid fa-book"></i> 保存目标
            </span>
        </div>

        <div class="cpr-wi-panel">

            <div class="cpr-wi-pair-row">
                <div class="cpr-wi-field">
                    <label class="cpr-wi-label" for="cpr-out-bookname">世界书</label>
                    <div class="cpr-wi-input-wrap">
                        <select id="cpr-out-bookname" class="cpr-wi-input">
                            <option value="">加载世界书列表...</option>
                        </select>
                    </div>
                </div>

                <div class="cpr-wi-field">
                    <label class="cpr-wi-label" for="cpr-out-entryname">条目名</label>
                    <div class="cpr-wi-input-wrap">
                        <input
                            type="text"
                            id="cpr-out-entryname"
                            class="cpr-wi-input"
                            value="档案压缩"
                            placeholder="档案压缩"
                        />
                    </div>
                </div>
            </div>

            <div class="cpr-wi-control-row">
                <span class="cpr-wi-label">写入方式</span>
                <label class="cpr-wi-check cpr-wi-check--compact">
                    <input type="radio" name="cpr-write-mode" value="overwrite" checked />
                    <span>覆盖</span>
                </label>
                <label class="cpr-wi-check cpr-wi-check--compact">
                    <input type="radio" name="cpr-write-mode" value="append" />
                    <span>追加</span>
                </label>
            </div>

            <div class="cpr-wi-control-row">
                <label class="cpr-wi-check cpr-wi-check--compact">
                    <input type="checkbox" id="cpr-wi-extract" checked />
                    <span>自动清理思维链</span>
                </label>
            </div>

            <div class="cpr-wi-control-row cpr-wi-control-row--tight">
                <div class="cpr-cleanup-config">
                    <label class="cpr-wi-label cpr-wi-label--inline" for="cpr-wi-extract-mode">清理标签</label>
                    <select id="cpr-wi-extract-mode" class="cpr-select cpr-select--compact">
                        <option value="thinking" selected>&lt;thinking&gt;</option>
                        <option value="think">&lt;think&gt;</option>
                        <option value="custom">其他</option>
                    </select>
                </div>
            </div>

            <div class="cpr-wi-custom-row">
                <input
                    type="text"
                    id="cpr-wi-extract-custom"
                    class="cpr-wi-input"
                    placeholder="自定义标签名，多个用逗号分隔"
                    style="display:none"
                />
            </div>

        </div>
    </div>

    <div class="cpr-divider"></div>

    <!-- ── 压缩预览 ──────────────────────────────────────────────── -->
    <div class="cpr-section">
        <div class="cpr-section-hd">
            <span class="cpr-section-label">
                <i class="fa-solid fa-window-restore"></i> 压缩预览
            </span>
            <span id="cpr-preview-status" class="cpr-preview-status">待生成</span>
        </div>

        <textarea
            id="cpr-preview"
            class="cpr-textarea cpr-preview-textarea"
            rows="10"
            placeholder="开始压缩后，这里会同步显示将写入世界书的内容。"
            readonly
        ></textarea>

        <div class="cpr-preview-actions">
            <button
                class="cpr-icon-btn cpr-icon-btn--save cpr-preview-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_confirmPreview'))"
                title="确认当前预览并写入世界书"
            ><i class="fa-solid fa-check"></i> 确认写入</button>
            <button
                class="cpr-icon-btn cpr-preview-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_reroll'))"
                title="删除本次生成并重新压缩"
            ><i class="fa-solid fa-rotate-right"></i> 重ROLL</button>
            <button
                id="cpr-continue-btn"
                class="cpr-icon-btn cpr-preview-btn"
                onclick="document.dispatchEvent(new CustomEvent('Cpr_continue'))"
                title="继续上一次生成（同酒馆继续按钮）"
                disabled
            ><i class="fa-solid fa-forward"></i> 继续</button>
        </div>
    </div>

</div>

/* ─────────────────────────────────────────────────────────────────
   总结的总结模块样式（命名空间前缀 cpr-）

}

    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: bold;
    color: var(--SmartThemeTextColor);
    opacity: 0.9;
}

.cpr-divider {
    border: none;
    border-top: 1px solid var(--SmartThemeBorderColor, rgba(255,255,255,0.1));
    margin: 10px 0;
}

/* ── 世界书浏览器 ────────────────────────────────────────────── */
.cpr-browser-hd {

    align-items: center;
    margin-bottom: 5px;
}

.cpr-select--flex {
    flex: 1;
    min-width: 0;
}

.cpr-entry-checklist {

    border-radius: 5px;

    max-height: 130px;
    overflow-y: auto;
    padding: 3px;

}

.cpr-entry-check-item {

}

.cpr-entry-check-item:hover {

.cpr-browser-footer {

}

.cpr-check-all-label {
